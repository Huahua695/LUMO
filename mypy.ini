[mypy]
python_version = 3.11
# 引擎层（enhance/cut_engine/下载器/媒体转换/proc/paths/utils）已补注解；
# UI 层依赖 PySide6 动态特性，不纳入检查范围。
files = app/enhance.py,app/cut_engine.py,app/ytdlp_dl.py,app/direct_dl.py,app/m3u8_dl.py,app/media_convert.py,app/proc.py,app/paths.py,app/utils.py,app/url_detect.py,app/base_task.py,app/app_settings.py,app/version.py
exclude = (venv|build|dist|tools_test|backup_frames|model_conv)
ignore_missing_imports = True
check_untyped_defs = True
warn_redundant_casts = True
no_implicit_optional = True
